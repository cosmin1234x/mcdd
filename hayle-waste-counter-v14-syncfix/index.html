<!doctype html>
<html lang="en-GB">
<head>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hayle Waste">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Hayle Waste Counter</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-v11.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-v11-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.3.0/files/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.3.0/files/dm-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="./portal.css?v=19">
  <link rel="stylesheet" href="./waste.css?v=19">
  <style>
    body{background:var(--paper);font-family:var(--font-body);color:var(--ink)}
    #content{padding:28px max(18px,var(--pad-x)) calc(120px + env(safe-area-inset-bottom));min-width:0}
    @media(max-width:720px){#content{padding:16px 12px calc(116px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <main id="content" class="content"></main>
  <div id="toast" class="toast-stack" role="status" aria-live="polite"></div>
  <script type="module" src="./standalone-entry.js?v=19"></script>
